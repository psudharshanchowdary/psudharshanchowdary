<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040609" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#020407" />
    </linearGradient>
    
    <!-- Neon Cyberpunk Gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00dfd8" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="deepBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      /* Smooth Floating Animations for Background Blobs */
      @keyframes float-1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -20px) scale(1.1); }
        66% { transform: translate(-20px, 15px) scale(0.95); }
      }
      @keyframes float-2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, 20px) scale(1.15); }
      }
      
      /* Glowing border rotation */
      @keyframes border-rotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -2200; }
      }

      /* Pulse scale for the central orb */
      @keyframes pulse-orb {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }

      /* Text shimmer animation */
      @keyframes text-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.3)); }
        50% { filter: drop-shadow(0 0 15px rgba(0, 223, 216, 0.7)); }
      }

      /* Drawing lines animations */
      @keyframes draw-path {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      /* Particle animation */
      @keyframes float-particle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-80px) translateX(15px); opacity: 0; }
      }

      .blob-pink {
        animation: float-1 12s ease-in-out infinite;
        transform-origin: 150px 150px;
      }
      .blob-cyan {
        animation: float-2 15s ease-in-out infinite;
        transform-origin: 650px 150px;
      }
      .orb-pulse {
        animation: pulse-orb 6s ease-in-out infinite;
        transform-origin: 400px 150px;
      }
      .glow-border {
        stroke-dasharray: 1100;
        animation: border-rotate 10s linear infinite;
      }
      .glow-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 5px;
        fill: url(#neonPink);
        animation: text-glow 5s ease-in-out infinite;
      }
      .glow-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 3px;
        fill: #8b949e;
      }
      .wave-line {
        stroke-dasharray: 600;
        animation: draw-path 9s linear infinite;
      }
      .particle {
        animation: float-particle 6s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Dark Cosmic Canvas Background -->
  <rect width="800" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Backdrop Lights -->
  <circle class="blob-pink" cx="150" cy="150" r="120" fill="#ff007f" filter="url(#deepBlur)" opacity="0.25" />
  <circle class="blob-cyan" cx="650" cy="150" r="130" fill="#00dfd8" filter="url(#deepBlur)" opacity="0.25" />
  <circle class="orb-pulse" cx="400" cy="150" r="80" fill="#7928ca" filter="url(#deepBlur)" opacity="0.2" />

  <!-- Tech Grid Pattern -->
  <g opacity="0.06">
    <path d="M0 30 H800 M0 60 H800 M0 90 H800 M0 120 H800 M0 150 H800 M0 180 H800 M0 210 H800 M0 240 H800 M0 270 H800" stroke="#ffffff" stroke-width="1" />
    <path d="M80 0 V300 M160 0 V300 M240 0 V300 M320 0 V300 M400 0 V300 M480 0 V300 M560 0 V300 M640 0 V300 M720 0 V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Glowing Digital Wave / Signal Paths -->
  <path class="wave-line" d="M -50 200 Q 150 100 400 200 T 850 200" fill="none" stroke="url(#neonPink)" stroke-width="2.5" filter="url(#glow)" opacity="0.75" />
  <path class="wave-line" d="M -50 100 Q 200 220 400 100 T 850 100" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)" opacity="0.6" style="animation-duration: 13s; animation-direction: reverse;" />

  <!-- Animated Floating Particles -->
  <circle class="particle" cx="180" cy="220" r="2.5" fill="#00dfd8" style="animation-delay: 0s; animation-duration: 5s;" />
  <circle class="particle" cx="300" cy="260" r="1.5" fill="#ff007f" style="animation-delay: 1.5s; animation-duration: 7s;" />
  <circle class="particle" cx="500" cy="210" r="2" fill="#00dfd8" style="animation-delay: 0.5s; animation-duration: 6s;" />
  <circle class="particle" cx="620" cy="240" r="3" fill="#7928ca" style="animation-delay: 2.2s; animation-duration: 8s;" />

  <!-- Central branding & Typography -->
  <g transform="translate(400, 140)" text-anchor="middle">
    <!-- Glowing title -->
    <text class="glow-title" y="0">SUDHARSHAN CHOWDARY</text>
    <!-- Subtitle -->
    <text class="glow-sub" y="42">COMPUTER VISION • CLOUD INFRASTRUCTURE • FULL-STACK</text>
  </g>

  <!-- Outer Neon Frame with Moving Glow Laser -->
  <rect x="8" y="8" width="784" height="284" rx="12" fill="none" stroke="#21262d" stroke-width="1" />
  <rect class="glow-border" x="8" y="8" width="784" height="284" rx="12" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#glow)" opacity="0.9" />
</svg>
